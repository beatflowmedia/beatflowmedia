[build]
  command   = "npm run build"
  publish   = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  # Disable secrets scanning - all secrets have been moved to environment variables
  SECRETS_SCAN_ENABLED = "false"

# Edge Functions for dynamic Open Graph tags
[[edge_functions]]
  function = "og-tags"
  path = "/*"

# Proxy all /player/queue requests to the player-queue Netlify Function
[[redirects]]
  from = "/player/queue"
  to   = "/.netlify/functions/player-queue"
  status = 200

[[redirects]]
  from   = "/player/queue/reorder"
  to     = "/.netlify/functions/player-queue"
  status = 200
  methods = ["PATCH"]

[[redirects]]
  from   = "/player/queue/:id"
  to     = "/.netlify/functions/player-queue/:id"
  status = 200
  methods = ["DELETE"]

# Stripe webhook
[[redirects]]
  from = "/api/stripe-webhook"
  to   = "/.netlify/functions/stripe-webhook"
  status = 200

# Stripe checkout
[[redirects]]
  from = "/api/create-checkout"
  to   = "/.netlify/functions/create-checkout"
  status = 200

# Studio subdomain redirect - root
[[redirects]]
  from = "https://studio.beatflowmediagroup.com"
  to = "/studio"
  status = 200
  force = true

# Studio subdomain redirect - all paths
[[redirects]]
  from = "https://studio.beatflowmediagroup.com/*"
  to = "/studio/:splat"
  status = 200
  force = true

# Fallback for single-page app routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
