name: Agentic CI Pipeline

on:
  pull_request:
    branches: [main, feature/*]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck || true
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e || true
      - name: Build
        run: npm run build
      - name: Storybook static build
        run: npm run build-storybook
      - name: Deploy preview (on PR)
        if: github.event_name == 'pull_request'
        run: echo "Trigger preview deployment here"
      - name: Enforce secrets policy
        run: echo "Check for secrets in commits"
      - name: Sign commits (simulated)
        run: echo "Sign commits with agent key"
