[build]
  publish   = "build"
  functions = "netlify/functions"

# your scheduled functions…
[[functions]]
  schedule = "0 3 * * *"

# ─── SPA redirect ───────────────────────────────────────────────────────
# Serve index.html for all routes, so React Router can take over.
[[redirects]]
  from     = "/*"
  to       = "/index.html"
  status   = 200
  force    = true
